{% extends "base.html" %}
{% block title %}Register - Movie Genre Finder{% endblock %}

{% block content %}
<h1>Create an account</h1>
<p class="subtitle">It only takes a few seconds.</p>

<form method="POST" class="box">
  <label for="username">Username</label>
  <input type="text" id="username" name="username"
         minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
         title="Letters, numbers and underscore only" required>
  <span class="hint">3-20 characters: letters, numbers, underscore</span>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" minlength="6" required>
  <span class="hint">At least 6 characters</span>

  <label for="confirm_password">Confirm password</label>
  <input type="password" id="confirm_password" name="confirm_password" required>

  <button type="submit">Register</button>
</form>

<p class="small">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
{% endblock %}
